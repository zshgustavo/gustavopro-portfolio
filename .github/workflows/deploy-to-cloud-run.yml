name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || secrets.PROJECT_ID || vars.GCP_PROJECT_ID || vars.PROJECT_ID }}
  GCR_REPO: ${{ secrets.GCR_REPOSITORY || secrets.GCR_REPO || vars.GCR_REPOSITORY || vars.GCR_REPO }}
  SERVICE: ${{ secrets.CLOUD_RUN_SERVICE || secrets.SERVICE || vars.CLOUD_RUN_SERVICE || vars.SERVICE }}
  REGION: ${{ secrets.CLOUD_RUN_REGION || secrets.REGION || vars.CLOUD_RUN_REGION || vars.REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GCP_SERVICE_ACCOUNT_KEY || secrets.GOOGLE_CREDENTIALS || vars.GCP_SA_KEY || vars.GCP_SERVICE_ACCOUNT_KEY || vars.GOOGLE_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker gcr.io

      - name: Build and Push Docker image
        run: |
          IMAGE_NAME="${{ env.GCR_REPO }}:${{ github.sha }}"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GCR_REPO }}:${{ github.sha }}

      - name: Show Output
        run: echo "Deployed Service URL ${{ steps.deploy.outputs.url }}"
