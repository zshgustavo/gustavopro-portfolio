server {
    listen 8080;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # 1. Default route (SPA fallback) and dynamic-ish files (HTML, JSON, Markdown)
    # We want browsers to revalidate these so your content updates show up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 2. Cache Vite's hashed assets (JS/CSS) for 1 year
    # Vite bundles these with unique hashes, so they are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 3. Cache static media/images/fonts for 1 year
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }
}